name: Tests

# Runs the pytest suite. No secrets and no paid API calls.
# Slack posting and email sending stay in briefing.yml and are not invoked here.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python3 -m pytest tests/ -v
