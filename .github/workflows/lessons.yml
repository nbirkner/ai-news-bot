name: AI lessons

# Tuesday lesson at 9:00 America/Los_Angeles. Two UTC crons cover daylight
# saving; the guard continues only when the Pacific hour is 9.
# The scheduled run broadcasts to RESEND_LESSONS_AUDIENCE_ID.
# This workflow does not read RESEND_AUDIENCE_ID. A missing lessons
# audience fails closed inside the script and does not send.
# Slack posting and the site publish stay off.
on:
  schedule:
    - cron: "0 16 * * 2"
    - cron: "0 17 * * 2"
  workflow_dispatch:
    inputs:
      date:
        description: "Lesson date (YYYY-MM-DD). Blank uses today in America/Los_Angeles."
        type: string
        default: ""
      dry_run:
        description: "Write the lesson and do not send. Uncheck to send."
        type: boolean
        default: true
      test_to:
        description: "Send one email to this address instead of the broadcast. Ignored when dry_run is checked."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ai-lessons
  cancel-in-progress: false

jobs:
  lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Pacific 9am guard
        id: guard
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run. The 9:00 America/Los_Angeles guard applies to the schedule only."
            exit 0
          fi
          hour=$(TZ=America/Los_Angeles date +%H)
          echo "America/Los_Angeles hour is ${hour}"
          if [ "$hour" = "09" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping. The Tuesday lesson runs only when the America/Los_Angeles hour is 9."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.proceed == 'true'

      - name: Restore lesson state
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state
          key: lessons-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lessons-state-

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.proceed == 'true'
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.proceed == 'true'

      - name: Resolve lesson date
        id: when
        if: steps.guard.outputs.proceed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          LESSON_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ -z "$LESSON_DATE" ]; then
            day=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          else
            day="$LESSON_DATE"
          fi
          if ! [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Lesson date must be YYYY-MM-DD" >&2
            exit 2
          fi
          echo "date=$day" >> "$GITHUB_OUTPUT"

      - name: Lesson
        id: lesson
        if: steps.guard.outputs.proceed == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_LESSONS_AUDIENCE_ID: ${{ secrets.RESEND_LESSONS_AUDIENCE_ID }}
          RESEND_LESSONS_FROM: ${{ secrets.RESEND_LESSONS_FROM }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          TEST_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.test_to || '' }}
          LESSON_WEEKLY_DIR: /cursor/stores/bot/ai-lessons-weekly
        run: |
          set -euo pipefail
          args=(main_newsletter.py --mode lesson --date "${{ steps.when.outputs.date }}")
          case "${DRY_RUN}" in
            1|true|True|yes|YES) args+=(--dry-run) ;;
            *) args+=(--send) ;;
          esac
          python "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.proceed == 'true'
        with:
          name: lesson-out
          path: out/
          if-no-files-found: ignore

      # Only a real broadcast updates the cache. A dry run, a test email,
      # a missing audience, and a failed send leave it untouched.
      - name: Save lesson state
        if: steps.lesson.outputs.sent == 'true'
        uses: actions/cache/save@v4
        with:
          path: state
          key: lessons-state-${{ github.run_id }}-${{ github.run_attempt }}
