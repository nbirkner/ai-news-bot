name: AI briefing

# Friday newsletter, aimed at 9:00 America/Los_Angeles.
# GitHub started the old Monday 16:00 and 17:00 UTC crons 5 to 7.5 hours late
# on 26 Oct, 2 Nov, and 9 Nov 2026. Those runs then exited 0 without sending.
# These crons are the same Pacific hours on Friday: 16:00-23:00 UTC Friday,
# 00:00-07:00 UTC Saturday, and 08:30 UTC Saturday, Sunday, and Monday.
# schedule.yaml send_from is empty, so these crons do not send and do not
# alarm. That includes a merge on Friday evening: later Saturday-UTC hours
# are still Friday night Pacific, and they skip. Set send_from to the first
# Friday that should go out. GitHub cron is only the backup. It does not
# guarantee 9:00 AM and can drop every run. The primary send is a manual or
# external workflow_dispatch, dry_run false, on a Friday, with window_end
# set to that Friday. An explicit Monday window_end is kept as that Monday,
# which is how 2026-10-26, 2026-11-02, and 2026-11-09 are backfilled.
# dry_run stays true unless someone unchecks it.
# A second run does not broadcast twice: sent_issues.json and an existing
# Resend email or submitted broadcast stop it. Accepting a broadcast is not
# inbox delivery. Delivery is a separate --verify-delivery check of
# last_event, and last_event sent is not delivered.
# Slack posting and the site publish stay off.
on:
  schedule:
    - cron: "0 16-23 * * 5"
    - cron: "0 0-7 * * 6"
    - cron: "30 8 * * 6,0,1"
  workflow_dispatch:
    inputs:
      window_end:
        description: "Window end (YYYY-MM-DD), 15:00 UTC that day. Blank uses the Friday of the current America/Los_Angeles week. A Monday date is used as given."
        type: string
        default: ""
      dry_run:
        description: "Write the issue and do not send. Uncheck to send."
        type: boolean
        default: true
      test_to:
        description: "Send one email to this address instead of the broadcast. Ignored when dry_run is checked."
        type: string
        default: ""
      verify_delivery:
        description: "Read Resend last_event for this issue. Does not send."
        type: boolean
        default: false
      allow_off_day:
        description: "Allow a manual send when today is not the issue's weekday in America/Los_Angeles. Friday issues wait for Friday. A Monday window_end still waits for Monday. Leave false."
        type: boolean
        default: false
      clear_pending:
        description: "Drop the uncertain send block for window_end. Does not send. Use only after checking Resend."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-briefing
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}

      - name: Restore briefing state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: briefing-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            briefing-state-

      - name: Decide whether this run sends
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          SENT_PATH: state/sent_issues.json
        run: python3 scripts/schedule_guard.py

      - name: Friday issue was not sent
        if: steps.guard.outputs.action == 'fail' || (steps.guard.outputs.missed != '' && steps.guard.outputs.action != 'send')
        env:
          REASON: ${{ steps.guard.outputs.reason }}
        run: |
          echo "::error title=Friday AI News was not sent::${REASON}"
          {
            echo "## Friday AI News was not sent"
            echo
            echo "${REASON}"
            echo
            echo "This failed job is the alert. It does not send email or Slack."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.action == 'send'
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.action == 'send'

      - name: Resolve Friday window
        id: window
        if: steps.guard.outputs.action == 'send'
        env:
          EVENT_NAME: ${{ github.event_name }}
          WINDOW_END: ${{ inputs.window_end }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            end=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          elif [ -n "$WINDOW_END" ]; then
            end="$WINDOW_END"
          else
            end=$(python3 -c "from src.issue_run import pacific_friday; print(pacific_friday())")
          fi
          if ! [[ "$end" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Window end must be YYYY-MM-DD" >&2
            exit 2
          fi
          start=$(python3 - "$end" <<'PY'
          import sys
          from src.issue_run import parse_window_end, weekly_window_start
          print(weekly_window_start(parse_window_end(sys.argv[1])).strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          )
          echo "Window end ${end}, start ${start}"
          echo "end=$end" >> "$GITHUB_OUTPUT"
          echo "start=$start" >> "$GITHUB_OUTPUT"

      - name: Newsletter
        id: newsletter
        if: steps.guard.outputs.action == 'send'
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_ENABLED: ${{ vars.EXA_ENABLED || '0' }}
          EXA_MAX_CALLS: ${{ vars.EXA_MAX_CALLS || '6' }}
          TOGETHER_MODEL: ${{ vars.TOGETHER_MODEL || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          VERIFY_DELIVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_delivery && '1' || '0' }}
          TEST_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.test_to || '' }}
          EVENT_NAME: ${{ github.event_name }}
          ALLOW_OFF_DAY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_off_day && '1' || '0' }}
          CLEAR_PENDING: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_pending && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "${CLEAR_PENDING}" = "1" ] || [ "${CLEAR_PENDING}" = "true" ]; then
            python main_newsletter.py --clear-pending --window-end "${{ steps.window.outputs.end }}"
            exit 0
          fi
          if [ "${VERIFY_DELIVERY}" = "1" ] || [ "${VERIFY_DELIVERY}" = "true" ]; then
            python main_newsletter.py --verify-delivery --window-end "${{ steps.window.outputs.end }}"
            exit 0
          fi
          args=(main_newsletter.py --window-end "${{ steps.window.outputs.end }}" --window-start "${{ steps.window.outputs.start }}")
          case "${DRY_RUN}" in
            1|true|True|yes|YES) args+=(--dry-run) ;;
            *) args+=(--send) ;;
          esac
          python "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.action == 'send'
        with:
          name: newsletter-out
          path: out/
          if-no-files-found: ignore

      # Only a real broadcast updates the cache. A dry run, a test email,
      # an empty issue, and a failed send leave it untouched.
      # always() so a later alert step cannot skip this save.
      - name: Save briefing state
        if: always() && (steps.newsletter.outputs.sent == 'true' || steps.newsletter.outputs.save_state == 'true')
        uses: actions/cache/save@v4
        with:
          path: state
          key: briefing-state-${{ github.run_id }}-${{ github.run_attempt }}

      # A current-week send can still leave an earlier armed Friday unsent.
      # Fail after the cache save so that week is recorded and the miss stays visible.
      - name: Earlier Friday was not sent
        if: always() && steps.guard.outputs.action == 'send' && steps.guard.outputs.missed != ''
        env:
          MISSED: ${{ steps.guard.outputs.missed }}
        run: |
          echo "::error title=Earlier Friday AI News was not sent::${MISSED}"
          {
            echo "## Earlier Friday AI News was not sent"
            echo
            echo "${MISSED}"
            echo
            echo "This failed job is the alert. It does not send another email."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
