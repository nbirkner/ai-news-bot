name: AI briefing

# Monday newsletter, aimed at 9:00 America/Los_Angeles.
# Both UTC crons stay. 16:00 UTC is 9:00 PDT and 8:00 PST; 17:00 UTC is
# 10:00 PDT and 9:00 PST. Dropping either one misses 9:00 for half the year.
# On schedule, the guard proceeds when the Pacific weekday is Monday and the
# hour is 09 through 12 inclusive, so a late Actions start still sends
# through noon. A second cron the same Monday does not broadcast twice:
# main_newsletter.py exits 0 when state/sent_issues.json already lists that
# window_end, and the cache is saved only after a real broadcast.
# Slack posting and the site publish stay off. This workflow does not post
# and it does not push the MDX anywhere.
on:
  schedule:
    - cron: "0 16 * * 1"
    - cron: "0 17 * * 1"
  workflow_dispatch:
    inputs:
      window_end:
        description: "Window end (YYYY-MM-DD), 15:00 UTC that day. Blank uses the Monday of the current America/Los_Angeles week."
        type: string
        default: ""
      dry_run:
        description: "Write the issue and do not send. Uncheck to send."
        type: boolean
        default: true
      test_to:
        description: "Send one email to this address instead of the broadcast. Ignored when dry_run is checked."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ai-briefing
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Pacific Monday window
        id: guard
        run: |
          set -euo pipefail
          hour=$(TZ=America/Los_Angeles date +%H)
          weekday_num=$(TZ=America/Los_Angeles date +%u)
          weekday_name=$(TZ=America/Los_Angeles date +%A)
          # 10# keeps 08 and 09 in decimal. A leading zero is octal in bash.
          hour_num=$((10#$hour))
          echo "America/Los_Angeles hour=${hour} weekday=${weekday_name} (${weekday_num})"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "proceed=true reason=manual ${{ github.event_name }}; Monday 09-12 America/Los_Angeles window applies to schedule only"
            exit 0
          fi
          if [ "$weekday_num" -eq 1 ] && [ "$hour_num" -ge 9 ] && [ "$hour_num" -le 12 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "proceed=true reason=Monday and hour ${hour} is inside 09-12 America/Los_Angeles"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            why="hour ${hour} is outside 09-12 America/Los_Angeles"
            if [ "$weekday_num" -ne 1 ]; then
              why="weekday is ${weekday_name}, not Monday"
              if [ "$hour_num" -lt 9 ] || [ "$hour_num" -gt 12 ]; then
                why="${why}; hour ${hour} is outside 09-12 America/Los_Angeles"
              fi
            fi
            echo "proceed=false reason=${why}"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.proceed == 'true'
        with:
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}

      - name: Restore briefing state
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state
          key: briefing-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            briefing-state-

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.proceed == 'true'
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.proceed == 'true'

      - name: Resolve Monday window
        id: window
        if: steps.guard.outputs.proceed == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          WINDOW_END: ${{ inputs.window_end }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            end=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          elif [ -n "$WINDOW_END" ]; then
            end="$WINDOW_END"
          else
            end=$(python3 -c "from src.issue_run import pacific_monday; print(pacific_monday())")
          fi
          if ! [[ "$end" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Window end must be YYYY-MM-DD" >&2
            exit 2
          fi
          start=$(python3 - "$end" <<'PY'
          import sys
          from src.issue_run import parse_window_end, weekly_window_start
          print(weekly_window_start(parse_window_end(sys.argv[1])).strftime("%Y-%m-%dT%H:%M:%SZ"))
          PY
          )
          echo "Window end ${end}, start ${start}"
          echo "end=$end" >> "$GITHUB_OUTPUT"
          echo "start=$start" >> "$GITHUB_OUTPUT"

      - name: Newsletter
        id: newsletter
        if: steps.guard.outputs.proceed == 'true'
        env:
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          # Exa stays off unless a repository variable sets EXA_ENABLED to 1.
          EXA_ENABLED: ${{ vars.EXA_ENABLED || '0' }}
          EXA_MAX_CALLS: ${{ vars.EXA_MAX_CALLS || '6' }}
          TOGETHER_MODEL: ${{ vars.TOGETHER_MODEL || '' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          TEST_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.test_to || '' }}
        run: |
          set -euo pipefail
          args=(main_newsletter.py --window-end "${{ steps.window.outputs.end }}" --window-start "${{ steps.window.outputs.start }}")
          case "${DRY_RUN}" in
            1|true|True|yes|YES) args+=(--dry-run) ;;
            *) args+=(--send) ;;
          esac
          python "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always() && steps.guard.outputs.proceed == 'true'
        with:
          name: newsletter-out
          path: out/
          if-no-files-found: ignore

      # Only a real broadcast updates the cache. A dry run, a test email,
      # an empty issue, and a failed send leave it untouched.
      - name: Save briefing state
        if: steps.newsletter.outputs.sent == 'true'
        uses: actions/cache/save@v4
        with:
          path: state
          key: briefing-state-${{ github.run_id }}-${{ github.run_attempt }}
