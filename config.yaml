# Monday / Wednesday / Friday at 15:00 UTC.
# 8:00 AM Pacific Daylight Time, 7:00 AM Pacific Standard Time.
# GitHub Actions cron does not follow daylight saving, so the UTC hour stays put.
lookback_fallback_hours: 80
max_lookback_hours: 168
state_retention_days: 21
# Ask the model for 4 to 7 items. Fewer is correct when the window is thin.
max_items: 7
material_score: 6
paper_min_score: 9
max_per_source: 8
max_per_source_in_briefing: 2
max_per_signature: 1
# How many deduped candidates get full text before the model ranks them.
read_candidates: 15
read_full_text: true
llm_rank: true
theme_lede: true
# Hard cap on Exa /search and /contents calls per run. EXA_MAX_CALLS overrides this.
exa_max_calls: 30
# Inference model only. The briefing itself is general public news, not a
# Together product, customer, or revenue note. Override with TOGETHER_MODEL.
together_model: "zai-org/GLM-5.3"

